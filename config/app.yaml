app:
  name: cdp-core
  env: local


postgres:
  host: localhost
  port: 5432
  database: cdp_core
  user: cdp_core
  password: ""
  pool_min_size: 2
  pool_max_size: 10
  connect_timeout_seconds: 10

kafka:
  bootstrap_servers: "localhost:9092"
  events_v1_topic: "cdp.events.v1"
  events_dlq_topic: "cdp.events.dlq"

logging:
  level: INFO
  output: stdout
  format: text
  file_path: null

metrics:
  enabled: false

tracing:
  enabled: false

otel:
  service_name: cdp-core
  logs_endpoint: "http://localhost:4318/v1/logs"
  metrics_endpoint: "http://localhost:4318/v1/metrics"
  traces_endpoint: "http://localhost:4318/v1/traces"
  metric_export_interval: 60000
