services:
  cdp-core-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cdp_core
      POSTGRES_USER: cdp_core
      POSTGRES_PASSWORD: "local dev secret"
    ports:
      - "5433:5432"
    volumes:
      - cdp-core-postgres-data:/var/lib/postgresql/data
    networks:
      - cdp-core-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdp_core -d cdp_core"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cdp-core-kafka:
    image: bitnami/kafka:3.9
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@cdp-core-kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    networks:
      - cdp-core-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

networks:
  cdp-core-net:
    driver: bridge

volumes:
  cdp-core-postgres-data:
    driver: local
