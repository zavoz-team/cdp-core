services:
  cdp-core-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cdp_core
      POSTGRES_USER: cdp_core
      POSTGRES_PASSWORD: "local dev secret"
    ports:
      - "5432:5432"
    volumes:
      - cdp-core-postgres-data:/var/lib/postgresql/data
    networks:
      - cdp-core-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdp_core -d cdp_core"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cdp-core-kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@cdp-core-kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    networks:
      - cdp-core-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  cdp-core-kafka-setup:
    image: apache/kafka:3.9.0
    depends_on:
      cdp-core-kafka:
        condition: service_healthy
    networks:
      - cdp-core-net
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server cdp-core-kafka:9092 --create --if-not-exists --topic cdp.events.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server cdp-core-kafka:9092 --create --if-not-exists --topic cdp.events.dlq --partitions 1 --replication-factor 1

networks:
  cdp-core-net:
    driver: bridge

volumes:
  cdp-core-postgres-data:
    driver: local
