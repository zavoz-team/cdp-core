services:
  cdp-core-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cdp_core
      POSTGRES_USER: cdp_core
      POSTGRES_PASSWORD: "local dev secret"
    ports:
      - "5432:5432"
    volumes:
      - cdp-core-postgres-data:/var/lib/postgresql/data
    networks:
      - cdp-core-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdp_core -d cdp_core"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cdp-core-kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@cdp-core-kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://cdp-core-kafka:9094
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    networks:
      - cdp-core-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  cdp-core-kafka-setup:
    image: apache/kafka:3.9.0
    depends_on:
      cdp-core-kafka:
        condition: service_healthy
    networks:
      - cdp-core-net
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server cdp-core-kafka:9094 --create --if-not-exists --topic cdp.events.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server cdp-core-kafka:9094 --create --if-not-exists --topic cdp.events.dlq --partitions 1 --replication-factor 1

  cdp-core-migrations:
    image: gglamer/cdp-core-migrations:latest
    environment:
      CDP_CORE_POSTGRES_HOST: cdp-core-postgres
      CDP_CORE_POSTGRES_PORT: "5432"
      CDP_CORE_POSTGRES_DATABASE: cdp_core
      CDP_CORE_POSTGRES_USER: cdp_core
      CDP_CORE_POSTGRES_PASSWORD: "local dev secret"
    depends_on:
      cdp-core-postgres:
        condition: service_healthy
    networks:
      - cdp-core-net

  cdp-core-api:
    image: gglamer/cdp-core-api:latest
    ports:
      - "8000:8000"
    environment:
      CDP_CORE_POSTGRES_HOST: cdp-core-postgres
      CDP_CORE_POSTGRES_PORT: "5432"
      CDP_CORE_POSTGRES_DATABASE: cdp_core
      CDP_CORE_POSTGRES_USER: cdp_core
      CDP_CORE_POSTGRES_PASSWORD: "local dev secret"
      CDP_CORE_KAFKA_BOOTSTRAP_SERVERS: cdp-core-kafka:9094
      CDP_CORE_LOGGING_OUTPUT: otel
      CDP_CORE_METRICS_ENABLED: "true"
      CDP_CORE_TRACING_ENABLED: "true"
      CDP_CORE_OTEL_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      CDP_CORE_OTEL_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      CDP_CORE_OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      cdp-core-migrations:
        condition: service_completed_successfully
      cdp-core-kafka:
        condition: service_healthy
    networks:
      - cdp-core-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cdp-core-worker:
    image: gglamer/cdp-core-worker:latest
    environment:
      CDP_CORE_POSTGRES_HOST: cdp-core-postgres
      CDP_CORE_POSTGRES_PORT: "5432"
      CDP_CORE_POSTGRES_DATABASE: cdp_core
      CDP_CORE_POSTGRES_USER: cdp_core
      CDP_CORE_POSTGRES_PASSWORD: "local dev secret"
      CDP_CORE_KAFKA_BOOTSTRAP_SERVERS: cdp-core-kafka:9094
      CDP_CORE_LOGGING_OUTPUT: otel
      CDP_CORE_METRICS_ENABLED: "true"
      CDP_CORE_TRACING_ENABLED: "true"
      CDP_CORE_OTEL_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      CDP_CORE_OTEL_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      CDP_CORE_OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      cdp-core-migrations:
        condition: service_completed_successfully
      cdp-core-kafka-setup:
        condition: service_completed_successfully
    networks:
      - cdp-core-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time; assert time.time()-float(open('/tmp/worker_heartbeat').read())<30\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  otel-collector:
    image: grafana/otel-lgtm:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - lgtm-data:/data
    networks:
      - cdp-core-net

networks:
  cdp-core-net:
    driver: bridge

volumes:
  cdp-core-postgres-data:
    driver: local
  lgtm-data:
